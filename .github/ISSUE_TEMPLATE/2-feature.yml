name: Feature
description: Something Rookery can't do at all yet. This comes before the pull request.
type: Feature
labels: [needs triage]
body:
  - type: markdown
    attributes:
      value: |
        Read [CONTRIBUTING.md](https://github.com/aiviarium/rookery/blob/main/.github/CONTRIBUTING.md) first, in particular what Rookery is and isn't. Keep one issue to one change. If rookery does this already but could do it better, use **Improvement**. For an agent, tool or service, use **Integration**.
  - type: textarea
    id: problem
    attributes:
      label: What you ran into
      description: The situation that made you want this, in your own words.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What you propose
      description: What Rookery would do that it can't do now.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in and what is left out. Smaller is better.
  - type: dropdown
    id: plugin
    attributes:
      label: Could it be a plugin
      description: Whatever works as a plugin should be one, often in a repository of its own.
      options:
        - Not sure
        - "Yes"
        - No, it needs a change to Rookery itself
  - type: dropdown
    id: area
    attributes:
      label: What you were doing
      options:
        - Not sure
        - Getting a new host running
        - Choosing what a host gets, or applying it
        - Looking after a running host
        - Reaching a host (terminal, SSH, tunnels, desktop)
        - Sign-ins, secrets, keys or registries
        - Making hosts or resources on a node
        - Using an agent or tool on a host
        - Running a Rookery server for others
        - Writing a plugin or using the API
  - type: checkboxes
    id: work
    attributes:
      label: Who does it
      options:
        - label: I'd like to write this myself
