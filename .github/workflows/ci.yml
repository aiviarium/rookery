name: CI

on:
  pull_request:
  push:
    branches: [go]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      plugins: ${{ steps.filter.outputs.plugins }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            plugins:
              - 'plugins/**'
              - 'pkg/sdk/**'
              - 'proto/**'
              - 'gen/**'
              - 'go.work'
              - 'go.work.sum'
              - 'Makefile'

  # The Go checks run as parallel jobs: generated code, lint, Ansible, the
  # tests in two shards and the cross-builds. None waits for another.
  gen:
    name: gen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: rookery
          POSTGRES_PASSWORD: rookery-test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U rookery"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare the environment
        run: |
          mkdir -p "$RUNNER_TEMP/tmp" "$RUNNER_TEMP/go/bin"
          {
            echo "ROOKERY_TEST_POSTGRES=postgres://rookery:rookery-test@127.0.0.1:55432/postgres?sslmode=disable"
            echo "TMPDIR=$RUNNER_TEMP/tmp"
            echo "GOBIN=$RUNNER_TEMP/go/bin"
          } >> "$GITHUB_ENV"

      # buf generate runs protoc-gen-es from the TypeScript workspace.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('sdk/ts/bun.lock') }}

      - name: Cache the generation and lint tools
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/go/bin
          key: tools-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - run: make tools-go

      - name: Generated code is current
        run: |
          make gen
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Modules are tidy
        run: go mod tidy -diff

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare the environment
        run: |
          mkdir -p "$RUNNER_TEMP/tmp" "$RUNNER_TEMP/go/bin"
          {
            echo "ROOKERY_TEST_POSTGRES=postgres://rookery:rookery-test@127.0.0.1:55432/postgres?sslmode=disable"
            echo "TMPDIR=$RUNNER_TEMP/tmp"
            echo "GOBIN=$RUNNER_TEMP/go/bin"
          } >> "$GITHUB_ENV"

      - name: Cache the generation and lint tools
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/go/bin
          key: tools-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - run: make tools-go

      - uses: actions/cache@v6
        with:
          path: ~/.cache/golangci-lint
          key: golangci-${{ runner.os }}-${{ hashFiles('go.sum', '.golangci.yml') }}-${{ github.sha }}
          restore-keys: golangci-${{ runner.os }}-${{ hashFiles('go.sum', '.golangci.yml') }}-

      - run: make lint-go

  ansible:
    name: ansible
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install Ansible
        run: |
          pipx install --include-deps "ansible-lint==26.11.0"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: make ansible

  test:
    name: test (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: rookery
          POSTGRES_PASSWORD: rookery-test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U rookery"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare the environment
        run: |
          mkdir -p "$RUNNER_TEMP/tmp" "$RUNNER_TEMP/go/bin"
          {
            echo "ROOKERY_TEST_POSTGRES=postgres://rookery:rookery-test@127.0.0.1:55432/postgres?sslmode=disable"
            echo "TMPDIR=$RUNNER_TEMP/tmp"
            echo "GOBIN=$RUNNER_TEMP/go/bin"
          } >> "$GITHUB_ENV"

      - name: Install Xvfb for the desktop tests
        run: |
          if ! command -v Xvfb >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends xvfb
          fi

      - run: make test-shard SHARD=${{ matrix.shard }} SHARDS=2

  cross:
    name: cross
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - run: make cross

  ts:
    name: ts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('sdk/ts/bun.lock') }}

      # The workspace's dependencies, the type-check, the unit tests and the
      # fixture plugins' bundles. The fixtures are workspace members, so the
      # lockfile covers them too.
      - run: make ts

  # The plugins' own modules: the Docker plugin drives the runner's Docker engine
  # with plain containers, and skips its systemd machine tests, which run only
  # where ROOKERY_TEST_DOCKER_SYSTEMD=1 -- the machine image build below runs
  # them here, unprivileged.
  plugins:
    name: plugins
    needs: changes
    if: needs.changes.outputs.plugins == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare the environment
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"

      - name: Build the machine image
        run: docker build -t rookery/machine:test -f images/machine.Dockerfile images

      - name: Test the plugins
        env:
          ROOKERY_TEST_DOCKER_SYSTEMD: "1"
          ROOKERY_TEST_MACHINE_IMAGE: rookery/machine:test
        run: make test-plugins
