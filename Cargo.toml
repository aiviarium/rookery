[workspace]
resolver = "3"
members = ["crates/rookery-api", "crates/rookery-pty", "crates/rookery-core", "crates/rookery-setup", "crates/rookery", "crates/rookeryd", "crates/box", "crates/rookery-proto", "crates/rookery-store", "crates/rookery-kernel", "crates/rookery-auth", "crates/rookery-server", "crates/rookery-facilities", "crates/rookery-jobs"]
# The vendored crate is a member because it lives inside; it is left out of what
# is built, tested and linted by default.
default-members = ["crates/rookery-api", "crates/rookery-pty", "crates/rookery-core", "crates/rookery-setup", "crates/rookery", "crates/rookeryd", "crates/box", "crates/rookery-proto", "crates/rookery-store", "crates/rookery-kernel", "crates/rookery-auth", "crates/rookery-server", "crates/rookery-facilities", "crates/rookery-jobs"]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Members that talk to a server ask for the client; the set-up alone does not.
rookery-api = { path = "crates/rookery-api", default-features = false }
rookery-pty = { path = "crates/rookery-pty" }
rookery-core = { path = "crates/rookery-core" }
rookery-setup = { path = "crates/rookery-setup" }
tui-input = { path = "crates/vendor/tui-input", default-features = false }
# rookery serve. Linux only: none of it reaches the client on macOS and Windows, rookeryd or box.
rookery-proto = { path = "crates/rookery-proto" }
rookery-store = { path = "crates/rookery-store" }
rookery-kernel = { path = "crates/rookery-kernel" }
rookery-auth = { path = "crates/rookery-auth" }
rookery-server = { path = "crates/rookery-server" }
rookery-facilities = { path = "crates/rookery-facilities" }
rookery-jobs = { path = "crates/rookery-jobs" }
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "derive", "postgres", "uuid", "chrono", "json"] }
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
schemars = "1"
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tempfile = "3"
vt100 = "=0.16.2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "io-std", "process", "sync", "time", "signal", "fs"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
utoipa = { version = "6", features = ["axum_extras"] }
utoipa-axum = "0.3"
rusqlite = { version = "0.40", features = ["bundled"] }
postgres = "0.19"
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
# Plugins are Hatchery packages: resolving, locking and installing eggs.
hatchery = { git = "https://github.com/aiviarium/hatchery", rev = "5ece78ce5324da064731ae47c6ec76ef13d23aa4" }

# Development and test builds: line numbers in backtraces, and no debug
# information for dependencies, which makes them quicker to build and link.
# For a debugger, CARGO_PROFILE_DEV_DEBUG=true gives rookery's own crates full
# debug information.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
strip = true

# What a development or test build of rookery carries. rookeryd and box are built
# incrementally, and small, as rookery packs them.
[profile.host-dev]
inherits = "dev"
opt-level = "s"
debug = false
strip = true
