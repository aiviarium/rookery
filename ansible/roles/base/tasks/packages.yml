---
# The packages every managed host has, and the upgrades it applies by itself.
- name: Update the package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install the base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - openssh-server
      - python3
      - sudo
      - ufw
      - unattended-upgrades
    state: present

- name: Apply upgrades without being asked
  when: base_unattended_upgrades | bool
  block:
    - name: Let apt run unattended upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: '0644'
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
          APT::Periodic::AutocleanInterval "7";

    # The archive's own packages, security first. Both distributions' origins are
    # listed, and apt ignores the ones this host does not have.
    - name: Keep the archive's packages current
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/51-rookery-unattended-upgrades
        owner: root
        group: root
        mode: '0644'
        content: |
          Unattended-Upgrade::Origins-Pattern {
            "origin=Ubuntu,codename=${distro_codename}-security,label=Ubuntu";
            "origin=Ubuntu,codename=${distro_codename}-updates,label=Ubuntu";
            "origin=Debian,codename=${distro_codename},label=Debian";
            "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
          };
          Unattended-Upgrade::Remove-Unused-Dependencies "true";
          Unattended-Upgrade::Automatic-Reboot "false";

    - name: Run the upgrade timers
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer
