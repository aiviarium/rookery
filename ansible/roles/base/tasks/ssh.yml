---
# SSH: keys only, as the operator has the ring's key. sshd reads its drop-ins in
# name order and takes the first value it reads, so this one sorts first.
- name: Configure sshd
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-rookery.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      Port {{ base_ssh_port }}
      PubkeyAuthentication yes
      PasswordAuthentication {{ 'yes' if base_ssh_password_authentication | bool else 'no' }}
      KbdInteractiveAuthentication no
      PermitRootLogin {{ base_ssh_permit_root_login }}
      X11Forwarding no
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd
