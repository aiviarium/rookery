version: v2
# Generated code is checked in. `make gen` rewrites it and CI fails on a diff.
plugins:
  - local: protoc-gen-go
    out: gen/go
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: gen/go
    opt: paths=source_relative
  # The TypeScript SDK's messages and services, for @rookery/proto. The plugin
  # comes from sdk/ts's dependencies: `make tools` installs them.
  - local: sdk/ts/node_modules/.bin/protoc-gen-es
    out: sdk/ts/proto/src/gen
    opt:
      - target=ts
      - import_extension=js
