# The boot tests, run by ci/run.sh boot. One container runs QEMU, the package
# cache and the release server the guest reaches through QEMU's user network,
# and drives the tests over SSH to the guest, which it forwards to its own
# port 22. Downloads, caches, logs and the guest's disks are under build/boot.
name: ${ROOKERY_CI_PROJECT:-rookery-ci}-boot

services:
  vm:
    image: ${ROOKERY_CI_BOOT_IMAGE:-rookery-ci-boot}
    build:
      context: ..
      dockerfile: ci/boot.Dockerfile
    working_dir: /src
    # Root, for the ports below 1024 and /dev/kvm; what it writes to build/boot
    # is handed back to the user at the end.
    user: "0:0"
    security_opt: [label=disable]
    # /dev/null stands in when the guest runs without KVM.
    devices: ["${ROOKERY_CI_KVM:-/dev/kvm}:/dev/kvm"]
    # The guest is the test host, at the port QEMU forwards to its SSH.
    extra_hosts: ["studio:127.0.0.1"]
    # With --keep, the guest's SSH on this machine's loopback.
    ports: ["127.0.0.1:${ROOKERY_CI_BOOT_SSH_PORT:-22722}:22"]
    volumes:
      - ..:/src:ro
      - ${ROOKERY_CI_TARGET:-target}:/src/target:ro
      - ../build/boot:/work
      # An installer ISO already on this machine, used as it is.
      - ${ROOKERY_CI_BOOT_ISO:-/dev/null}:/images/source.iso:ro
    environment:
      ROOKERY_E2E: "1"
      ROOKERY_E2E_HOST: studio
      ROOKERY_BOOT_ISO_NAME: ${ROOKERY_BOOT_ISO_NAME:-}
      ROOKERY_BOOT_EXTRAS: ${ROOKERY_CI_BOOT_EXTRAS:-}
      ROOKERY_BOOT_ISO_SHA256: ${ROOKERY_CI_BOOT_ISO_SHA256:-}
      ROOKERY_BOOT_MEMORY: ${ROOKERY_CI_BOOT_MEMORY:-}
      ROOKERY_BOOT_CPUS: ${ROOKERY_CI_BOOT_CPUS:-}
      ROOKERY_BOOT_TCG: ${ROOKERY_CI_BOOT_TCG:-}
      ROOKERY_BOOT_OWNER: ${ROOKERY_CI_USER:-}
      ROOKERY_BOOT_SSH_PORT: ${ROOKERY_CI_BOOT_SSH_PORT:-22722}
      ROOKERY_BOOT_CONTROL_URL: ${ROOKERY_CI_BOOT_CONTROL_URL:-}
      ROOKERY_BOOT_CONTROL_KEY: ${ROOKERY_CI_BOOT_CONTROL_KEY:-}
      ROOKERY_BOOT_CONTROL_USER: ${ROOKERY_CI_BOOT_CONTROL_USER:-}
      ROOKERY_BOOT_CONTROL_TAGS: ${ROOKERY_CI_BOOT_CONTROL_TAGS:-}
      CI: ${CI:-}
      GITHUB_ACTIONS: ${GITHUB_ACTIONS:-}
      TMPDIR: /work/tmp

# The same target directory as ci/compose.yml.
volumes:
  target:
    name: rookery-ci-target
