[package]
name = "rookery-auth"
description = "Signing in to rookery serve: auth.* methods, local accounts with one-time links, device sessions, access tokens and OpenID Connect with PKCE."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
doctest = false

[dependencies]
rookery-proto.workspace = true
rookery-store.workspace = true
rookery-kernel.workspace = true
tokio.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
tracing.workspace = true
# The identity provider: its metadata, keys and token endpoint over HTTPS, and its ID tokens.
ureq = "3"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
sha2 = "0.11"
base64 = "0.22"
rand = "0.9"
form_urlencoded = "1"
