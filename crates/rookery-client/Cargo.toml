[package]
name = "rookery-client"
description = "A Rust client of rookery serve: JSON-RPC over /ws with stream channels, over TCP, TLS or the Unix socket, and POST /rpc. No server crate reaches it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
doctest = false

[dependencies]
rookery-proto.workspace = true
rookery-api = { workspace = true, features = ["client"] }
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
rustls-native-certs = "0.8"
