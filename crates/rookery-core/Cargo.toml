[package]
name = "rookery-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# A store in memory for each installation, for the tests of other crates.
testing = []

[dependencies]
rookery-api = { workspace = true, features = ["client", "plugins"] }
serde_json.workspace = true
tempfile.workspace = true
libc.workspace = true
tokio.workspace = true
serde.workspace = true
futures-util.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
sha2 = "0.11"
hatchery = { workspace = true, features = ["http"] }
# eggs.lock, read and adjusted when the store restores it.
toml = "1"
chacha20poly1305.workspace = true
ed25519-dalek = { version = "2", default-features = false }
hmac = "0.12"
sha1 = "0.10"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }


[dev-dependencies]
# Its own tests keep the installation's state in memory.
rookery-core = { path = ".", features = ["testing"] }
