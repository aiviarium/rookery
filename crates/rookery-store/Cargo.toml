[package]
name = "rookery-store"
description = "The server's tables on Postgres, in the schema rookery, with numbered migrations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
doctest = false

[features]
# rookery_store::testing: a fresh database per test on the Postgres of ROOKERY_TEST_POSTGRES.
testing = []

[dependencies]
# A plugin's id, which a grant on a host may name.
rookery-api.workspace = true
rookery-proto.workspace = true
rookery-filter.workspace = true
tracing.workspace = true
regex = "1"
futures-util.workspace = true
async-trait = "0.1"
hmac = "0.13"
url = "2"
croner = "2"
chrono-tz = "0.10"
sqlx.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
sha2 = "0.11"
hex = "0.4"
rand = "0.9"
chacha20poly1305.workspace = true
base64 = "0.22"

[dev-dependencies]
rookery-store = { path = ".", features = ["testing"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
