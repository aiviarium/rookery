[package]
name = "rookery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The client of a rookery serve, and the set-up flow of its commands, on
# every system.
[dependencies]
rookery-api = { workspace = true, features = ["client", "plugins"] }
# Packs a plugin folder into an egg to send it to a server.
hatchery.workspace = true
rookery-setup.workspace = true
tokio.workspace = true
serde_json = "1"
serde.workspace = true
tempfile = "3"
crossterm = "=0.29.0"
# The command line: its grammar, help, errors and shell completions.
clap = { version = "4.5", features = ["derive", "wrap_help"] }
clap_complete = "4.5"
# The questions and progress drawn inline, below the command.
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
tui-input.workspace = true
futures-util.workspace = true
# TLS to a server, and the WebSocket of its portal.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
rustls-native-certs = "0.8"

# The installation, rookery serve and the commands, on Linux, where hosts are
# set up from.
[target.'cfg(target_os = "linux")'.dependencies]
rookery-core.workspace = true
# rookery serve on Postgres. Linux only, so the client on macOS and Windows has no server code.
rookery-server.workspace = true
tower = { version = "0.5", features = ["util"] }
# For its API document, which rookery serve's includes.
rookeryd = { path = "../rookeryd" }
axum.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
libc = "0.2"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Signs the access tokens of the tests.
ring = "0.17"
