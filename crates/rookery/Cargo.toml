[package]
name = "rookery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The client of a rookery serve, and the set-up flow of its commands, on
# every system.
[dependencies]
rookery-api = { workspace = true, features = ["client", "plugins"] }
# The client of rookery serve over /ws, and its wire types.
rookery-client.workspace = true
rookery-proto.workspace = true
# The challenge of a sign-in through the browser.
sha2 = "0.11"
base64 = "0.22"
# Packs a plugin folder into an egg to send it to a server.
hatchery.workspace = true
rookery-setup.workspace = true
tokio.workspace = true
serde_json = "1"
serde.workspace = true
tempfile = "3"
crossterm = "=0.29.0"
# The command line: its grammar, help, errors and shell completions.
clap = { version = "4.5", features = ["derive", "wrap_help"] }
clap_complete = "4.5"
# The questions and progress drawn inline, below the command.
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
tui-input.workspace = true
futures-util.workspace = true

# The installation, rookery serve and the commands, on Linux, where hosts are
# set up from.
[target.'cfg(target_os = "linux")'.dependencies]
rookery-core.workspace = true
# rookery serve on Postgres. Linux only, so the client on macOS and Windows has no server code.
rookery-server.workspace = true
rookery-hosts.workspace = true
libc = "0.2"
# rookery server import reads a store of before: a SQLite file, or one on PostgreSQL.
rusqlite.workspace = true
postgres.workspace = true
tokio-postgres-rustls.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
sqlx.workspace = true
chrono.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
# The import's tests write into a fresh database of the Postgres of ROOKERY_TEST_POSTGRES.
rookery-store = { workspace = true, features = ["testing"] }
