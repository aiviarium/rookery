---
# restic comes with the role's packages; the feature adds rclone.
- name: Install the backup command
  ansible.builtin.copy:
    src: "{{ rookery_plugin_dir }}/files/backup.sh"
    dest: /usr/local/sbin/rookery-backup
    mode: '0755'
- name: Write the backup settings
  ansible.builtin.copy:
    dest: /etc/rookery-backup.conf
    mode: '0644'
    content: |
      # Managed by rookery's backup plugin. Read by /usr/local/sbin/rookery-backup.
      REPOSITORY={{ rookery_backup_repository | default('') | quote }}
      AGENT_HOME={{ rookery_home | quote }}
      PATHS=({{ ([rookery_home, '/srv/agent'] + (rookery_backup_system_paths | default(['/etc/rookery', '/etc/rookery', '/var/lib/rookery']))) | map('quote') | join(' ') }})
      KEEP_DAILY={{ rookery_backup_keep_daily | default(7) | int }}
      KEEP_WEEKLY={{ rookery_backup_keep_weekly | default(4) | int }}
      KEEP_MONTHLY={{ rookery_backup_keep_monthly | default(6) | int }}
- name: Write what backups leave out
  ansible.builtin.copy:
    dest: /etc/rookery-backup.exclude
    mode: '0644'
    content: "{{ (rookery_backup_exclude | default(rookery_backup_exclude_default)) | join('\n') }}\n"
  vars:
    rookery_backup_exclude_default:
      - "**/.cache"
      - "**/node_modules"
      - "**/.npm/_cacache"
      - "**/.cargo/registry"
      - "**/target/debug"
      - "**/target/release"
      - "**/.gradle/caches"
      - "{{ rookery_home }}/.local/share/Trash"
      - "{{ rookery_home }}/.local/share/mise/installs"
# Other plugins name what of theirs can be made again by putting a file of
# patterns here.
- name: Make room for what other plugins leave out
  ansible.builtin.file:
    path: /etc/rookery-backup.exclude.d
    state: directory
    mode: '0755'
- name: Install the scheduled backup
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    mode: '0644'
    content: "{{ item.content }}"
  loop:
    - name: rookery-backup.service
      content: |
        [Unit]
        Description=rookery backup snapshot
        Wants=network-online.target
        After=network-online.target

        [Service]
        Type=oneshot
        ExecStart=/usr/local/sbin/rookery-backup snapshot
        Nice=10
        IOSchedulingClass=idle
    - name: rookery-backup.timer
      content: |
        [Unit]
        Description=rookery backup schedule

        [Timer]
        OnCalendar={{ rookery_backup_schedule | default('*-*-* 03:30:00') }}
        RandomizedDelaySec=30m
        Persistent=true

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"
  when: rookery_profile != 'container'
# Without a repository there is nothing to run on a schedule.
- name: Switch the schedule on or off
  ansible.builtin.systemd_service:
    name: rookery-backup.timer
    daemon_reload: true
    enabled: "{{ rookery_backup_repository | default('') | length > 0 }}"
    state: "{{ 'started' if rookery_backup_repository | default('') | length > 0 else 'stopped' }}"
  when: rookery_profile != 'container' and rookery_start_services
