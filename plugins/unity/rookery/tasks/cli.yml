---
- name: Download Unity's CLI installer
  ansible.builtin.get_url:
    url: https://unity.com/install.sh
    dest: /opt/rookery-tools/unity-install.sh
    mode: '0644'
- name: Read the installed Unity CLI version
  ansible.builtin.command:
    argv: ["{{ rookery_home }}/.local/bin/unity", --version]
  become_user: "{{ rookery_user }}"
  environment:
    HOME: "{{ rookery_home }}"
    UNITY_NON_INTERACTIVE: '1'
    UNITY_NO_UPDATE_CHECK: '1'
  register: rookery_unity_cli_installed
  changed_when: false
  failed_when: false
# The installer also registers Unity's skills with the coding agents it finds.
# Plugins run after the agents are installed, so it finds them.
- name: Install the selected Unity CLI version as the agent
  ansible.builtin.command:
    argv: [/bin/bash, /opt/rookery-tools/unity-install.sh]
    chdir: "{{ rookery_home }}"
  become_user: "{{ rookery_user }}"
  environment:
    HOME: "{{ rookery_home }}"
    PATH: "{{ rookery_tool_path }}"
    UNITY_CLI_VERSION: "{{ rookery_unity_cli_version | default('1.0.0-beta.17') }}"
    UNITY_NON_INTERACTIVE: '1'
  # The selected version is the least one: a newer one from Update stays.
  when: not (rookery_unity_cli_installed.stdout | default('') | trim is match('^[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z.-]+)?$') and rookery_unity_cli_installed.stdout | trim is version(rookery_unity_cli_version | default('1.0.0-beta.17'), '>=', version_type='semver'))
