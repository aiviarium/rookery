---
# The editor is installed through the CLI, so the CLI feature has to be on too.
- name: Check that the Unity CLI is installed
  ansible.builtin.stat:
    path: "{{ rookery_home }}/.local/bin/unity"
  register: rookery_unity_cli_binary
- name: Require the Unity CLI for installing an editor
  ansible.builtin.assert:
    that: rookery_unity_cli_binary.stat.exists
    fail_msg: The Unity Editor feature needs the Unity CLI feature switched on as well.
- name: Install the selected Unity editor as the agent
  ansible.builtin.command:
    argv: "{{ [rookery_home ~ '/.local/bin/unity', 'install', rookery_unity_editor_version | default('6000.7.0b8')] + (rookery_unity_editor_modules | default(['webgl']) | map('regex_replace', '^', '--module=') | list) + ['--yes', '--accept-eula'] }}"
    chdir: "{{ rookery_home }}"
    creates: "{{ rookery_home }}/Unity/Hub/Editor/{{ rookery_unity_editor_version | default('6000.7.0b8') }}/Editor/Unity"
  become_user: "{{ rookery_user }}"
  environment:
    HOME: "{{ rookery_home }}"
    PATH: "{{ rookery_tool_path }}"
    UNITY_NON_INTERACTIVE: '1'
    UNITY_NO_UPDATE_CHECK: '1'
# Editors and what the editor rebuilds in a project stay out of snapshots.
# The folder is read by the backup plugin and does nothing on a host without it.
- name: Make the folder for what backups can leave out
  ansible.builtin.file:
    path: /etc/rookery-backup.exclude.d
    state: directory
    mode: '0755'
- name: Name what backups can leave out
  ansible.builtin.copy:
    dest: /etc/rookery-backup.exclude.d/unity
    mode: '0644'
    content: |
      {{ rookery_home }}/Unity
      /srv/agent/workspaces/**/Library
      /srv/agent/workspaces/**/Temp
      /srv/agent/workspaces/**/Logs
