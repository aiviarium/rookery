// AgentService says what the daemon on a host is.

syntax = "proto3";

package rookery.host.v1;

import "rookery/host/v1/common.proto";

option go_package = "github.com/aiviarium/rookery/gen/go/rookery/host/v1;hostv1";

service AgentService {
  // Version reports the daemon's version, the machine it runs on and whether a
  // desktop answers. The apply reads it after a run and sets the host's type
  // from what the host now has.
  rpc Version(AgentServiceVersionRequest) returns (AgentServiceVersionResponse);
}

message AgentServiceVersionRequest {}

message AgentServiceVersionResponse {
  // The daemon's version, such as "0.1.0".
  string version = 1;

  // runtime.GOOS and runtime.GOARCH of the binary, such as "linux" and "amd64".
  string os = 2;
  string arch = 3;

  // The machine's host name.
  string hostname = 4;

  // How long the daemon has been running.
  uint64 uptime_seconds = 5;

  // Whether a desktop provider is registered. Its size and pause state are
  // DesktopService.State's answer.
  DesktopState desktop = 6;
}
