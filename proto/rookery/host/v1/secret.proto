syntax = "proto3";

package rookery.host.v1;

option go_package = "github.com/aiviarium/rookery/gen/go/rookery/host/v1;hostv1";

// SecretService gives local programs the host secrets granted to their Unix account.
service SecretService {
  rpc Get(SecretServiceGetRequest) returns (SecretServiceGetResponse);
}

message SecretServiceGetRequest {
  string name = 1;
}
message SecretServiceGetResponse {
  bytes value = 1;
}
