// Jobs: something to do, with a log, attempts and a result.

syntax = "proto3";

package rookery.v1;

import "google/protobuf/timestamp.proto";
import "rookery/v1/access.proto";

option go_package = "github.com/aiviarium/rookery/gen/go/rookery/v1;rookeryv1";

// Job is one piece of work: a kind, its arguments, the resource it is about, and
// how it ended.
message Job {
  string id = 1;
  // Kind is a core kind, such as host.apply, or a plugin's.
  string kind = 2;
  // ArgsCbor is the job's arguments, CBOR in Core Deterministic mode.
  bytes args_cbor = 3;
  // Resource is the resource URI the job is about, when it is about one.
  string resource = 4;
  // CreatedBy is who asked, such as user:01h… or plugin:example.
  string created_by = 5;
  // Parent is the job or roll-out this job is part of, when it is part of one.
  string parent = 6;
  // State is queued, running, succeeded, failed, cancelled or interrupted.
  string state = 7;
  int32 attempts = 8;
  int32 max_attempts = 9;
  // ResultCbor is what the job produced, CBOR in Core Deterministic mode.
  bytes result_cbor = 10;
  // Error is why a failed job failed.
  string error = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp started_at = 13;
  google.protobuf.Timestamp finished_at = 14;
}

// JobLine is one line of a job's log.
message JobLine {
  // Seq orders the lines of a job, and Follow continues from one.
  int64 seq = 1;
  google.protobuf.Timestamp at = 2;
  string line = 3;
}

message JobServiceEnqueueRequest {
  string kind = 1;
  bytes args_cbor = 2;
  // Resource is the resource URI the job is about, and what its access is
  // checked against.
  string resource = 3;
  string parent = 4;
}

message JobServiceEnqueueResponse {
  Job job = 1;
}

message JobServiceListRequest {
  // Kind, State and Resource filter when they are set.
  string kind = 1;
  string state = 2;
  string resource = 3;
  int32 limit = 4;
  string cursor = 5;
}

message JobServiceListResponse {
  repeated Job jobs = 1;
  string next_cursor = 2;
}

message JobServiceGetRequest {
  // Job is the job's id.
  string job = 1;
}

message JobServiceGetResponse {
  Job job = 1;
}

message JobServiceFollowRequest {
  // Job is the job's id.
  string job = 1;
  // From is the last line the caller has, and 0 for all of them.
  int64 from = 2;
}

message JobServiceFollowResponse {
  oneof event {
    // Line is a line of the log.
    JobLine line = 1;
    // Job is the job's state, sent when the job has ended.
    Job job = 2;
  }
}

message JobServiceCancelRequest {
  // Job is the job's id.
  string job = 1;
}

message JobServiceCancelResponse {
  Job job = 1;
}

message JobServiceRetryRequest {
  // Job is the job's id.
  string job = 1;
}

message JobServiceRetryResponse {
  Job job = 1;
}

// JobService enqueues jobs and follows them. A long call returns a job's id at
// once and the caller follows it.
service JobService {
  rpc Enqueue(JobServiceEnqueueRequest) returns (JobServiceEnqueueResponse) {
    option (rookery.v1.access) = { level: LEVEL_USE, resource: "resource" };
  }

  rpc List(JobServiceListRequest) returns (JobServiceListResponse) {
    option (rookery.v1.access) = { level: LEVEL_VIEW };
  }

  rpc Get(JobServiceGetRequest) returns (JobServiceGetResponse) {
    option (rookery.v1.access) = { level: LEVEL_VIEW, resource: "job" };
  }

  rpc Follow(JobServiceFollowRequest) returns (stream JobServiceFollowResponse) {
    option (rookery.v1.access) = { level: LEVEL_VIEW, resource: "job" };
  }

  rpc Cancel(JobServiceCancelRequest) returns (JobServiceCancelResponse) {
    option (rookery.v1.access) = { level: LEVEL_MANAGE, resource: "job" };
  }

  rpc Retry(JobServiceRetryRequest) returns (JobServiceRetryResponse) {
    option (rookery.v1.access) = { level: LEVEL_MANAGE, resource: "job" };
  }
}
