// Secrets: sealed with the deployment's key, scoped global, plugin/<id>,
// provisioner/<name> or host/<name>. Admins set them and list their names; a
// value goes only to what the scope says.

syntax = "proto3";

package rookery.v1;

import "google/protobuf/timestamp.proto";
import "rookery/v1/access.proto";

option go_package = "github.com/aiviarium/rookery/gen/go/rookery/v1;rookeryv1";

// Secret is a secret's name and scope, never its value.
message Secret {
  string name = 1;
  // Scope is global, plugin/<id>, provisioner/<name> or host/<name>.
  string scope = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message SecretServiceListRequest {
  // Scope is what to list; empty lists every scope.
  string scope = 1;
}

message SecretServiceListResponse {
  repeated Secret secrets = 1;
}

message SecretServiceSetRequest {
  string name = 1;
  string scope = 2;
  // Value is the secret itself, and never reaches a log or an error.
  bytes value = 3;
}

message SecretServiceSetResponse {
  Secret secret = 1;
}

message SecretServiceDeleteRequest {
  string name = 1;
  string scope = 2;
}

message SecretServiceDeleteResponse {
}

message SecretServiceRenameRequest {
  string name = 1;
  string scope = 2;
  string new_name = 3;
}

message SecretServiceRenameResponse {
  Secret secret = 1;
}

// SecretService is the deployment's secrets: admins write them, and what a scope
// says reads them through the server's own calls.
service SecretService {
  rpc List(SecretServiceListRequest) returns (SecretServiceListResponse) {
    option (rookery.v1.access) = { level: LEVEL_ADMIN };
  }

  rpc Set(SecretServiceSetRequest) returns (SecretServiceSetResponse) {
    option (rookery.v1.access) = { level: LEVEL_ADMIN };
  }

  rpc Delete(SecretServiceDeleteRequest) returns (SecretServiceDeleteResponse) {
    option (rookery.v1.access) = { level: LEVEL_ADMIN };
  }

  rpc Rename(SecretServiceRenameRequest) returns (SecretServiceRenameResponse) {
    option (rookery.v1.access) = { level: LEVEL_ADMIN };
  }
}
