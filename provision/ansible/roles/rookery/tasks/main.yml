---
# A node is a server rookery applies without a desktop: node.yml. Everything
# else of the role is a workstation's: workstation.yml.
- name: Set up a node
  ansible.builtin.include_tasks: node.yml
  when: rookery_level == 'node'
- name: Set up a workstation
  ansible.builtin.include_tasks: workstation.yml
  when: rookery_level != 'node'
