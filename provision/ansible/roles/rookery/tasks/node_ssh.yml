---
# A node's SSH: rookery's key for the SSH user, then keys only.
- name: Read the SSH session this apply came in on
  ansible.builtin.command: printenv SSH_CONNECTION
  become: false
  register: rookery_ssh_session
  changed_when: false
  failed_when: false
- name: Note where this apply came from
  ansible.builtin.set_fact:
    rookery_apply_from: "{{ (rookery_ssh_session.stdout | default('') | trim).split(' ')[0] | default('') }}"
- name: Make the SSH user's folder of keys
  ansible.builtin.file:
    path: "{{ rookery_node_home }}/.ssh"
    state: directory
    owner: "{{ rookery_node_user }}"
    group: "{{ ansible_facts.getent_passwd[rookery_node_user][2] }}"
    mode: '0700'
# As for a workstation's operator: a block of its own for each rookery, named
# after its key, which no later apply removes.
- name: Give the SSH user the keys of the rookery that applies this
  ansible.builtin.blockinfile:
    path: "{{ rookery_node_home }}/.ssh/authorized_keys"
    create: true
    owner: "{{ rookery_node_user }}"
    group: "{{ ansible_facts.getent_passwd[rookery_node_user][2] }}"
    mode: '0600'
    marker: "# {mark} ROOKERY {{ rookery_ssh_public_key.split()[1] | hash('sha1') }}"
    block: "{{ rookery_ssh_public_key }}"
  when: rookery_ssh_public_key | length > 0
- name: Check that the SSH user takes the keys of the rookery that applies this
  ansible.builtin.command:
    argv: [grep, -qxF, --, "{{ item }}", "{{ rookery_node_home }}/.ssh/authorized_keys"]
  loop: "{{ rookery_ssh_public_key.splitlines() }}"
  changed_when: false
- name: See whether the SSH user has a key to log in with
  ansible.builtin.command: grep -qE '^(ssh-|ecdsa-|sk-)' {{ (rookery_node_home ~ '/.ssh/authorized_keys') | quote }}
  register: rookery_node_keys
  changed_when: false
  failed_when: false
# A machine taken in may let root in with keys already, as the one the rookery
# server recipes of 0.5 set up does for the server in its container. What
# rookery wrote before is kept as it is.
- name: See whether root logs in with keys here already
  ansible.builtin.shell: |
    if [ -f /etc/ssh/sshd_config.d/00-rookery.conf ]; then
      awk 'tolower($1) == "permitrootlogin" {print $2}' /etc/ssh/sshd_config.d/00-rookery.conf
    elif grep -qE '^(ssh-|ecdsa-|sk-)' /root/.ssh/authorized_keys 2>/dev/null; then
      /usr/sbin/sshd -T 2>/dev/null | awk '$1 == "permitrootlogin" {print $2}'
    else
      echo no
    fi
  register: rookery_node_root_login
  changed_when: false
  failed_when: false
# Only keys log in. Root keeps its login with keys when rookery logs in as root,
# so that this rookery is never locked out, and when it had one before; any
# other SSH user leaves root none. It is never opened to passwords.
- name: Require SSH keys, and keep root's login as rookery uses it
  ansible.builtin.copy:
    # sshd uses the first value it reads, so this has to sort before other drop-ins.
    dest: /etc/ssh/sshd_config.d/00-rookery.conf
    mode: '0644'
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin {{ 'prohibit-password' if rookery_node_user == 'root' or (rookery_node_root_login.stdout | default('no') | trim) in ['yes', 'prohibit-password', 'without-password'] else 'no' }}
    validate: /usr/sbin/sshd -t -f %s
  register: rookery_node_sshd
  when: rookery_harden_ssh and rookery_node_keys.rc == 0
- name: Remove SSH hardening when it is switched off
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/00-rookery.conf
    state: absent
  register: rookery_node_sshd_relaxed
  when: not (rookery_harden_ssh and rookery_node_keys.rc == 0)
- name: Explain skipped SSH hardening
  ansible.builtin.debug:
    msg: >-
      SSH hardening skipped: {{ rookery_node_user }} has no SSH key to log in
      with, so turning passwords off would lock this node.
  when: rookery_harden_ssh and rookery_node_keys.rc != 0
- name: Apply SSH server settings
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded
  when: rookery_start_services and (rookery_node_sshd.changed or rookery_node_sshd_relaxed.changed)
