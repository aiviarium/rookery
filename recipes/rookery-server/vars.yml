# What the recipe sets up. Change it here, or pass your own file:
#   ./install.sh -e @my-vars.yml

# ── The rookery server ──────────────────────────────────────────────────────

rookery_server_image: ghcr.io/aiviarium/rookery
# Where it keeps its settings, profiles, data and SSH keys.
rookery_server_dir: /srv/rookery
# The port on this machine only. Nothing outside reaches it.
rookery_server_port: 7777
# Put the server on the tailnet with TLS, at https://THIS-MACHINE.YOUR-TAILNET.ts.net.
# It needs the tailnet's HTTPS certificates switched on, and does nothing
# on a machine that is on no tailnet.
rookery_server_tailscale_serve: true
# Pull rookery_server_image and run the server from it when it is newer. A
# container that is there keeps its data and its options either way, and
# gets those of this file that it lacks.
#   ./install.sh -e rookery_server_update=true
rookery_server_update: false

# Make this machine a node of the server, a server rookery applies itself:
# the server gets root's login here with its own key, reaches this machine by
# the name `node`, and gets the socket of its Docker engine. Then add it from
# the server, as the README says. A container from an earlier run gets these
# and keeps its own.
rookery_server_node: false

# ── The tailnet ───────────────────────────────────────────────────────────

# An enrollment key joins the machine to your tailnet. Without one Tailscale
# is not installed: pass it on the command line rather than saving it here.
# This recipe runs before rookery does, so it takes a key made by hand; the
# hosts rookery sets up get theirs from rookery, with the secret tailnet_api_key.
#   ./install.sh -e tailscale_auth_key=tskey-auth-…
tailscale_auth_key: ""
tailscale_hostname: "{{ ansible_facts['hostname'] }}"
# The address of a Headscale server; empty for Tailscale's own service.
tailscale_login_server: ""

# ── The firewall ──────────────────────────────────────────────────────────

# Who may reach SSH from outside the tailnet: any, or one address or network
# such as 198.51.100.7. The provider's console is the way in if this is wrong.
ssh_from: any
