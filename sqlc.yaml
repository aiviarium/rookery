version: "2"
sql:
  - engine: postgresql
    schema: internal/store/schema.sql
    queries: internal/store/queries
    gen:
      go:
        package: store
        out: internal/store
        sql_package: pgx/v5
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        emit_exact_table_names: true
