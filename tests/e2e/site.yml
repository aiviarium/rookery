---
# The role as the end-to-end tests apply it: the tasks rookery itself talks to
# (accounts and keys, plugins, the agent's helpers, rookeryd and its files),
# without the desktop packages, toolchains and browsers that need the internet.
# A node gets its own tasks of the same kinds, without the packages and the
# Tailscale install that need the internet. The tests put this playbook where
# rookery looks for provision/ansible/site.yml.
- name: Configure what rookery talks to on a node
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Set the node up without the internet
      when: rookery_level | default('workstation') == 'node'
      block:
        - name: Check the node and find the account sessions run as
          ansible.builtin.include_role:
            name: rookery
            tasks_from: node_facts.yml
        - name: Let rookery in with its key, and nobody with a password
          ansible.builtin.include_role:
            name: rookery
            tasks_from: node_ssh.yml
        - name: Apply the features, rookery's controller and the record
          ansible.builtin.include_role:
            name: rookery
            tasks_from: node_rookery.yml

- name: Configure what rookery talks to on a host
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: End here for a node
      ansible.builtin.meta: end_host
      when: rookery_level | default('workstation') == 'node'
    - name: Check target and profile before any changes
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Ubuntu'
          - rookery_profile in ['laptop', 'cloud', 'container']
    - name: Check that the host can join the tailnet
      ansible.builtin.include_role:
        name: rookery
        tasks_from: tailnet_check.yml
      when: rookery_install_tailscale | default(false)
    - name: Configure accounts and paths
      ansible.builtin.include_role:
        name: rookery
        tasks_from: accounts.yml
    - name: Apply selected plugins
      ansible.builtin.include_role:
        name: rookery
        tasks_from: plugins.yml
    - name: Install the agent's helpers
      ansible.builtin.include_role:
        name: rookery
        tasks_from: desktop.yml
    - name: Install rookeryd, box and what they read
      ansible.builtin.include_role:
        name: rookery
        tasks_from: rookery.yml
    - name: Join the tailnet
      ansible.builtin.include_role:
        name: rookery
        tasks_from: tailnet.yml
      when: rookery_install_tailscale | default(false)
    - name: Record what this configuration came from
      ansible.builtin.include_role:
        name: rookery
        tasks_from: applied.yml
